[project]
name = "local-crawler-mcp"
version = "0.1.0"
description = "Deterministic local Playwright and macOS KakaoTalk collectors over MCP stdio"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "playwright>=1.56,<2"]

[project.scripts]
crawler-mcp = "crawler.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler"]
